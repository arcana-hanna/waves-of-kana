<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#c8443a"><title>Kana Path</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<style>
:root{color-scheme:light dark;--bg:#faf6ef;--sf:#fff;--ink:#2b2622;--mut:#766c63;--ln:#e6ded2;--a:#c8443a;--r:16px;font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#171513;--sf:#211e1b;--ink:#f2ece4;--mut:#a39a90;--ln:#352f2a;--a:#e8625a}}
body{margin:0;background:var(--bg);color:var(--ink)}main{max-width:480px;margin:auto;padding:12px 16px 40px;text-align:center}
h1{font-size:76px;margin:.15em;font-weight:500;line-height:1.1}h2{font-size:22px;margin:.3em 0}h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:.2em 0 .6em}
.jp,h1,.g,.t,.k{font-family:"UD Digi Kyokasho NK-R","Hiragino Maru Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif}
button{font:inherit;padding:.6em 1.1em;margin:4px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);cursor:pointer;min-height:44px}
button:active{transform:scale(.98)}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.big{background:var(--a);border-color:var(--a);color:#fff;width:100%;font-size:19px;font-weight:600;margin:8px 0 0;min-height:52px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px;margin:12px 0;text-align:left}.card h2{margin-top:0}
.hd{display:flex;justify-content:space-between;align-items:baseline;padding:8px 2px}.hd b{font-size:22px}.hd span,.s,small{color:var(--mut);font-size:14px}
.row{display:flex;gap:10px}.row button{flex:1;margin:0;padding:12px;text-align:left;display:flex;flex-direction:column}
.li{display:block;width:100%;text-align:left;margin:4px 0}
.g{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin:8px 0 14px}.c{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;font-size:15px;background:var(--bg);color:var(--mut);opacity:.6}
.l1{background:#f3d9d6;color:#7a2a24;opacity:1}.l2{background:#e9a39d;color:#4a1612;opacity:1}.l3{background:var(--a);color:#fff;opacity:1}
@media(prefers-color-scheme:dark){.l1{background:#4a2a27;color:#f0c5c0}.l2{background:#8a3a34;color:#fff}}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}.x{margin:0;min-width:44px;padding:0}.bar{flex:1;height:8px;background:var(--ln);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a);transition:width .3s}
canvas{width:100%;max-width:340px;aspect-ratio:1;touch-action:none;background:var(--sf);border:2px solid var(--ln);border-radius:var(--r);display:block;margin:10px auto}
.o{display:block;width:100%;margin:8px 0;font-size:19px}.k.on{background:var(--a);border-color:var(--a);color:#fff}
.ty{font-size:34px;min-height:1.6em;letter-spacing:.12em;margin:6px;border-bottom:2px solid var(--ln)}
.kb{position:sticky;bottom:0;background:var(--bg);padding:6px 0 10px}.kb div{display:flex;justify-content:center}.kk{flex:1;max-width:42px;min-width:0;padding:.7em 0;margin:2px;font-size:19px;touch-action:manipulation;user-select:none}
.fld{position:relative;height:42vh;max-height:340px;background:var(--sf);border:2px solid var(--ln);border-radius:var(--r);overflow:hidden;margin:8px 0}.t{position:absolute;font-size:30px;background:var(--bg);border:1px solid var(--ln);border-radius:20px;padding:2px 12px;transform:translateX(-50%);white-space:nowrap}
.jp{font-size:26px;margin-top:14px;text-align:left}.en{color:var(--mut);font-size:15px;cursor:pointer;min-height:1.4em;text-align:left}.en span,.en.show i{display:none}.en.show span{display:inline}
.scene{margin:16px 0 4px;min-height:96px;border:2px dashed var(--ln);border-radius:var(--r);display:grid;place-items:center;padding:12px;color:var(--mut);font-style:italic;font-size:15px}
.w{border-bottom:1px dotted var(--mut);cursor:pointer;border-radius:4px}.w.on{background:var(--ln)}.tip{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(92%,440px);box-sizing:border-box;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:12px 16px;box-shadow:0 6px 24px #0003;text-align:left;z-index:5}.tip span{color:var(--mut);display:block}.tip[hidden]{display:none}
label{display:block;margin:10px 0}summary{cursor:pointer;font-weight:600}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style><main id="app"></main><script src="app.js"></script>
